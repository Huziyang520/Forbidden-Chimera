# Minecraft 26.3 dropped modLoader / loaderVersion: NeoForge only supports javafml and both fields
# are now optional with unlimited defaults, so they are intentionally absent here.
license="${license}" # Review your options at https://choosealicense.com/.
issueTrackerURL="https://github.com/Huziyang520/Forbidden-Chimera/issues"
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
# 26.2+ uses iconFile for the square list icon and bannerFile for the wide detail banner.
# logoFile is deprecated. These fields only work inside the [[mods]] sub-table.
iconFile = "${mod_id}.png"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/forbidden-chimera"
authors = "${mod_author}" #optional
credits = "${credits}" #optional
description = '''${description}''' #mandatory (Supports multiline text)
# Mixin configs live in the common module so both loaders share one implementation.
[[mixins]]
config = "${mod_id}.mixins.json"
[[dependencies.${mod_id}]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[${neoforge_version},)" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
# GeckoLib supplies the Creeper Phantom's animated model, so it has to load first.
[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[5.5.6,)"
ordering = "AFTER"
side = "BOTH"
