// Modrinth 上传 init 脚本 —— 本项目（Forbidden Chimera / 26.3）专用。
//
// 用法（在 26.3 目录下，PowerShell）：
//   .\gradlew.bat mrVersions -I modrinth-upload-init.gradle --console=plain --no-daemon
//   .\gradlew.bat mrUpload -PmrModule=fabric   -I modrinth-upload-init.gradle --console=plain --no-daemon
//   .\gradlew.bat mrUpload -PmrModule=neoforge -I modrinth-upload-init.gradle --console=plain --no-daemon
//
// 可用 -P（均有默认值）：
//   -PmrModule        fabric | neoforge（MR 一个版本只能一个加载器，必须分开发）
//   -PmrProjectId     Modrinth 项目 ID（本项目 Ra3xIZu0）
//   -PmrVersionType   release | beta | alpha（默认 release）
//   -PmrChangelog     none = 留空（本项目约定不写日志）
//   -PmrGameVersions  逗号分隔的 MC 版本串（默认 26.3）
//
// 凭据红线（09 文档 §9.3）：modrinthApiKey 只在 Gradle 进程内经 findProperty 读取（来自用户全局
// C:\Users\HP\.gradle\gradle.properties），本脚本只检查存在性，绝不打印、不落盘、不传给外部命令。
//
// 网络：走本地 HTTP CONNECT 代理 127.0.0.1:7897（09 文档 §9.5）。
// 坑位说明（09 文档 §9.5.3）：`data` 部件必须是 application/json —— 这里在 Java 里手工拼 multipart，
// 部件类型自己控制，天然绕开 Invoke-RestMethod -Form 发不出合法 data 的坑，也不依赖 curl.exe。

import java.net.InetSocketAddress
import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse

def PROXY_HOST = '127.0.0.1'
def PROXY_PORT = 7897
def API_BASE = 'https://api.modrinth.com/v2'
def GECKOLIB_SLUG = 'geckolib'   // 前置：GeckoLib 必装。其项目 ID 由公开接口现查，不硬编码。

def MODULES = [
    'fabric'  : [jar: 'fabric/build/libs/forbidden_chimera-1.1.10-fabric-26.3.jar',     loader: 'fabric',   version: '1.1.10-fabric',   name: 'Forbidden Chimera 1.1.10 (Fabric) for Minecraft 26.3'],
    'neoforge': [jar: 'neoforge/build/libs/forbidden_chimera-1.1.10-neoforge-26.3.jar', loader: 'neoforge', version: '1.1.10-neoforge', name: 'Forbidden Chimera 1.1.10 (NeoForge) for Minecraft 26.3'],
]

gradle.rootProject {
    def httpClient = HttpClient.newBuilder()
            .proxy(ProxySelector.of(new InetSocketAddress(PROXY_HOST, PROXY_PORT)))
            .connectTimeout(java.time.Duration.ofSeconds(30))
            .build()

    // 只读：确认项目本身（草稿/未公开项目匿名 404，必须带令牌），再列已有版本，和 build/libs 对比。
    tasks.register('mrVersions') {
        doLast {
            def projectId = ((project.findProperty('mrProjectId') ?: 'Ra3xIZu0') as String)
            def key = (project.findProperty('modrinthApiKey') ?: '') as String
            if (!key) { throw new GradleException('未读到 modrinthApiKey（用户全局 gradle.properties），已中止；本脚本不打印该值。') }

            def projReq = HttpRequest.newBuilder(URI.create("${API_BASE}/project/${projectId}"))
                    .header('Authorization', key).header('Accept', 'application/json').GET().build()
            def projResp = httpClient.send(projReq, HttpResponse.BodyHandlers.ofString())
            if (projResp.statusCode() != 200) { throw new GradleException("读不到项目 ${projectId}：HTTP ${projResp.statusCode()}（带令牌仍 404 = 项目不存在或令牌无权访问）") }
            def proj = new groovy.json.JsonSlurper().parseText(projResp.body())
            println "mrVersions: 项目 ${proj.title}（${proj.slug} / ${proj.id}）status=${proj.status}"

            def req = HttpRequest.newBuilder(URI.create("${API_BASE}/project/${projectId}/version"))
                    .header('Authorization', key).header('Accept', 'application/json').GET().build()
            def resp = httpClient.send(req, HttpResponse.BodyHandlers.ofString())
            if (resp.statusCode() != 200) { throw new GradleException("拉取版本列表失败：HTTP ${resp.statusCode()} ${resp.body()}") }
            def list = new groovy.json.JsonSlurper().parseText(resp.body())
            println "mrVersions: 现有 ${list.size()} 个版本："
            list.forEach { v ->
                println String.format('  %-16s %-8s loaders=%-24s files=%s', v.version_number, v.version_type,
                        v.loaders.toString(), v.files.collect { it.filename }.toString())
            }
        }
    }

    tasks.register('mrUpload') {
        doLast {
            def moduleName = ((project.findProperty('mrModule') ?: 'fabric') as String)
            def mod = MODULES[moduleName]
            if (mod == null) { throw new GradleException("mrModule 只认 ${MODULES.keySet()}，收到：${moduleName}") }

            def key = (project.findProperty('modrinthApiKey') ?: '') as String
            if (!key) { throw new GradleException('未读到 modrinthApiKey（用户全局 gradle.properties），已中止；本脚本不打印该值。') }

            def projectId = ((project.findProperty('mrProjectId') ?: 'Ra3xIZu0') as String)
            def versionType = ((project.findProperty('mrVersionType') ?: 'release') as String)
            def changelogProp = ((project.findProperty('mrChangelog') ?: 'none') as String)
            def changelog = (changelogProp == 'none') ? '' : changelogProp
            def gameVersions = (((project.findProperty('mrGameVersions') ?: '26.3') as String).split(',')).collect { it.trim() }

            def jarFile = rootProject.file(mod.jar)
            if (!jarFile.isFile()) { throw new GradleException("产物不存在：${jarFile}（先构建再上传）") }

            // 1) 前置 GeckoLib 的项目 ID 现查（公开接口，无需凭据）。查不到就中止，不盲传。
            def geoReq = HttpRequest.newBuilder(URI.create("${API_BASE}/project/${GECKOLIB_SLUG}"))
                    .header('Accept', 'application/json').GET().build()
            def geoResp = httpClient.send(geoReq, HttpResponse.BodyHandlers.ofString())
            if (geoResp.statusCode() != 200) { throw new GradleException("查不到前置 ${GECKOLIB_SLUG} 的项目 ID：HTTP ${geoResp.statusCode()}") }
            def geckolibId = new groovy.json.JsonSlurper().parseText(geoResp.body()).id
            println "mrUpload: 前置 ${GECKOLIB_SLUG} -> ${geckolibId}"

            // 2) 版本体。environment 按用户口径：客户端和服务端都必须安装（09 文档 §9.5.2 枚举）。
            def dataJson = groovy.json.JsonOutput.toJson([
                project_id    : projectId,
                version_number: mod.version,
                name          : mod.name,
                changelog     : changelog,
                dependencies  : [[project_id: geckolibId, dependency_type: 'required']],
                game_versions : gameVersions,
                loaders       : [mod.loader],
                version_type  : versionType,
                featured      : false,
                status        : 'listed',
                environment   : 'client_and_server',
                file_parts    : ['file'],
                primary_file  : 'file',
            ])

            // 3) multipart：data 必须声明 application/json，file 才是文件上传。
            def boundary = '----forbiddenchimera' + System.currentTimeMillis()
            def dataBytes = dataJson.getBytes('UTF-8')
            def jarBytes = jarFile.getBytes()
            def head = ("--${boundary}\r\n" +
                    "Content-Disposition: form-data; name=\"data\"\r\n" +
                    "Content-Type: application/json\r\n\r\n").getBytes('UTF-8')
            def mid = ("\r\n--${boundary}\r\n" +
                    "Content-Disposition: form-data; name=\"file\"; filename=\"${jarFile.name}\"\r\n" +
                    "Content-Type: application/octet-stream\r\n\r\n").getBytes('UTF-8')
            def tail = ("\r\n--${boundary}--\r\n").getBytes('UTF-8')

            def body = new byte[head.length + dataBytes.length + mid.length + jarBytes.length + tail.length]
            int p = 0
            System.arraycopy(head, 0, body, p, head.length); p += head.length
            System.arraycopy(dataBytes, 0, body, p, dataBytes.length); p += dataBytes.length
            System.arraycopy(mid, 0, body, p, mid.length); p += mid.length
            System.arraycopy(jarBytes, 0, body, p, jarBytes.length); p += jarBytes.length
            System.arraycopy(tail, 0, body, p, tail.length)

            def req = HttpRequest.newBuilder(URI.create("${API_BASE}/version"))
                    .header('Authorization', key)
                    .header('Content-Type', "multipart/form-data; boundary=${boundary}")
                    .POST(HttpRequest.BodyPublishers.ofByteArray(body))
                    .build()
            def resp = httpClient.send(req, HttpResponse.BodyHandlers.ofString())
            if (resp.statusCode() != 200 && resp.statusCode() != 201) {
                throw new GradleException("上传失败：HTTP ${resp.statusCode()} ${resp.body()}")
            }
            def parsed = new groovy.json.JsonSlurper().parseText(resp.body())
            println "★ mrUpload 成功：${moduleName} -> version id = ${parsed.id}（${mod.version}，${versionType}，status=${parsed.status}）"
        }
    }
}
