// CurseForge 上传 init 脚本 —— 本项目（Forbidden Chimera / 26.3）专用。
//
// 用法（在 26.3 目录下，PowerShell）：
//   .\gradlew.bat cfUpload -PcfModule=fabric   -I curseforge-upload-init.gradle --console=plain --no-daemon
//   .\gradlew.bat cfUpload -PcfModule=neoforge -I curseforge-upload-init.gradle --console=plain --no-daemon
//
// 可用 -P（均有默认值，一般不用传）：
//   -PcfModule          fabric | neoforge
//   -PcfProjectId       CurseForge Project ID（本项目 1712379）
//   -PcfReleaseType     release | beta | alpha（默认 release）
//   -PcfChangelog       none = 更新日志留空（本项目约定不写日志）；也可给一段文本
//   -PcfMcVersions      逗号分隔的 MC 版本串（默认 26.3）
//   -PcfJavaVersion     Java 版本串（默认取 gradle.properties 的 java_version → "Java 25"）
//
// 凭据红线（09 文档 §9.3）：curseforge_api_key 只在 Gradle 进程内经 findProperty 读取（来自用户全局
// C:\Users\HP\.gradle\gradle.properties），本脚本只检查存在性，绝不打印、不落盘、不传给外部命令。
//
// 网络（09 文档 §9.4.2）：本机直连会被 Cloudflare 人机挑战拦下；api.curseforge.com/v1 在本机不可用。
// 因此这里用 JDK HttpClient + 显式 HTTP CONNECT 代理（127.0.0.1:7897）+ legacy 端点 minecraft.curseforge.com/api。

import java.net.InetSocketAddress
import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse

def PROXY_HOST = '127.0.0.1'
def PROXY_PORT = 7897
def API_BASE = 'https://minecraft.curseforge.com/api'

// 模块 → 可分发 jar。产物以 build/libs 里 actual 存在的文件为准，脚本只做校验不做构建。
def MODULES = [
    'fabric'  : [jar: 'fabric/build/libs/forbidden_chimera-1.1.10-fabric-26.3.jar',      loader: 'Fabric',  display: 'Forbidden Chimera 1.1.10 (Fabric) for Minecraft 26.3'],
    'neoforge': [jar: 'neoforge/build/libs/forbidden_chimera-1.1.10-neoforge-26.3.jar',  loader: 'NeoForge', display: 'Forbidden Chimera 1.1.10 (NeoForge) for Minecraft 26.3'],
]

// 前置：GeckoLib 必装（两端都要）。
def REQUIRED_DEPENDENCIES = [[slug: 'geckolib', type: 'requiredDependency']]

gradle.rootProject {
    def httpClient = HttpClient.newBuilder()
            .proxy(ProxySelector.of(new InetSocketAddress(PROXY_HOST, PROXY_PORT)))
            .connectTimeout(java.time.Duration.ofSeconds(30))
            .build()

    // 显式代理自检：不带 key，只看链路通不通（09 文档 §9.4.3 的 cfProxyCheck 思路）。
    tasks.register('cfProxyCheck') {
        doLast {
            def req = HttpRequest.newBuilder(URI.create("${API_BASE}/game/versions"))
                    .header('Accept', 'application/json').GET().build()
            def resp = httpClient.send(req, HttpResponse.BodyHandlers.ofString())
            println "cfProxyCheck: HTTP ${resp.statusCode()}（401/403 = 链路已通到 CF、仅缺 key；超时/连接拒绝 = 代理没开）"
        }
    }

    tasks.register('cfVersions') {
        doLast {
            def key = (project.findProperty('curseforge_api_key') ?: '') as String
            if (!key) { throw new GradleException('未读到 curseforge_api_key（用户全局 gradle.properties），已中止；本脚本不打印该值。') }
            def req = HttpRequest.newBuilder(URI.create("${API_BASE}/game/versions"))
                    .header('X-Api-Token', key).header('Accept', 'application/json').GET().build()
            def resp = httpClient.send(req, HttpResponse.BodyHandlers.ofString())
            if (resp.statusCode() != 200) { throw new GradleException("拉取游戏版本失败：HTTP ${resp.statusCode()}（key 有效性与链路用 cfProxyCheck 区分）") }
            def all = new groovy.json.JsonSlurper().parseText(resp.body())
            println "cfVersions: 共 ${all.size()} 条。与本项目相关的（名称含 26.3 / Java 25 / Fabric / NeoForge / Client / Server）："
            all.findAll { it.name ==~ /(^26\.3$|^Java 25$|^Fabric$|^NeoForge$|^Client$|^Server$)/ }
               .forEach { println String.format('  %-10s id=%-8s type=%s', it.name, it.id, it.type) }
        }
    }

    tasks.register('cfUpload') {
        doLast {
            def moduleName = ((project.findProperty('cfModule') ?: 'fabric') as String)
            def mod = MODULES[moduleName]
            if (mod == null) { throw new GradleException("cfModule 只认 ${MODULES.keySet()}，收到：${moduleName}") }

            def key = (project.findProperty('curseforge_api_key') ?: '') as String
            if (!key) { throw new GradleException('未读到 curseforge_api_key（用户全局 gradle.properties），已中止；本脚本不打印该值。') }

            def projectId = ((project.findProperty('cfProjectId') ?: '1712379') as String)
            def releaseType = ((project.findProperty('cfReleaseType') ?: 'release') as String)
            def changelogProp = ((project.findProperty('cfChangelog') ?: 'none') as String)
            def changelog = (changelogProp == 'none') ? '' : changelogProp
            def mcVersions = (((project.findProperty('cfMcVersions') ?: '26.3') as String).split(',')).collect { it.trim() }
            def javaVersion = ((project.findProperty('cfJavaVersion') ?: "Java ${project.findProperty('java_version') ?: '25'}") as String)
            def wanted = mcVersions + [mod.loader, javaVersion, 'Client', 'Server']

            def jarFile = rootProject.file(mod.jar)
            if (!jarFile.isFile()) { throw new GradleException("产物不存在：${jarFile}（先构建再上传）") }

            // 1) 版本串 → 数值 ID。解析不到就中止，绝不盲传（09 文档 §9.4.3 第 3 条）。
            def req = HttpRequest.newBuilder(URI.create("${API_BASE}/game/versions"))
                    .header('X-Api-Token', key).header('Accept', 'application/json').GET().build()
            def resp = httpClient.send(req, HttpResponse.BodyHandlers.ofString())
            if (resp.statusCode() != 200) { throw new GradleException("拉取游戏版本失败：HTTP ${resp.statusCode()}") }
            def all = new groovy.json.JsonSlurper().parseText(resp.body())

            def ids = []
            def missing = []
            wanted.unique().forEach { String want ->
                def hit = all.findAll { it.name == want }
                if (hit.isEmpty()) { missing << want; return }
                if (hit.size() > 1) {
                    // 同名多条（26.3 就有 17045 / 17046 两条）：取最小 id，即最早收录的那条。
                    // 09 文档 §9.4.4 的既有成功先例（MC 26.3 上传）用的正是 17045。这里显式留痕，方便复核。
                    def chosen = hit.min { (it.id as int) }
                    println "cfUpload: 版本串 ${want} 命中 ${hit.collect { it.id }}，取最小 id -> ${chosen.id}"
                    ids << (chosen.id as int)
                    return
                }
                ids << (hit[0].id as int)
            }
            if (!missing.isEmpty()) { throw new GradleException("以下版本串在 CurseForge 解析不到，已中止：${missing}。可用 cfVersions 看候选。") }
            println "cfUpload: gameVersions = ${wanted.unique()} -> ids = ${ids}"

            // 2) metadata（字段名与 CurseGradle 逐字对齐，见 09 文档 §9.4.4）。
            def metadataJson = groovy.json.JsonOutput.toJson([
                changelog     : changelog,
                changelogType : 'markdown',
                displayName   : mod.display,
                releaseType   : releaseType,
                gameVersions  : ids,
                relations     : [projects: REQUIRED_DEPENDENCIES],
            ])

            // 3) multipart：metadata 必须是普通表单字段（绝不能带 filename=），file 才带。
            def boundary = '----forbiddenchimera' + System.currentTimeMillis()
            def metaBytes = metadataJson.getBytes('UTF-8')
            def jarBytes = jarFile.getBytes()
            def head = ("--${boundary}\r\n" +
                    "Content-Disposition: form-data; name=\"metadata\"\r\n" +
                    "Content-Type: application/json\r\n\r\n").getBytes('UTF-8')
            def mid = ("\r\n--${boundary}\r\n" +
                    "Content-Disposition: form-data; name=\"file\"; filename=\"${jarFile.name}\"\r\n" +
                    "Content-Type: application/java-archive\r\n\r\n").getBytes('UTF-8')
            def tail = ("\r\n--${boundary}--\r\n").getBytes('UTF-8')

            def body = new byte[head.length + metaBytes.length + mid.length + jarBytes.length + tail.length]
            int p = 0
            System.arraycopy(head, 0, body, p, head.length); p += head.length
            System.arraycopy(metaBytes, 0, body, p, metaBytes.length); p += metaBytes.length
            System.arraycopy(mid, 0, body, p, mid.length); p += mid.length
            System.arraycopy(jarBytes, 0, body, p, jarBytes.length); p += jarBytes.length
            System.arraycopy(tail, 0, body, p, tail.length)

            def upload = HttpRequest.newBuilder(URI.create("${API_BASE}/projects/${projectId}/upload-file"))
                    .header('X-Api-Token', key)
                    .header('Content-Type', "multipart/form-data; boundary=${boundary}")
                    .POST(HttpRequest.BodyPublishers.ofByteArray(body))
                    .build()

            // 4) legacy 端点偶发 HTTP 500，先重跑一次再排查（09 文档 §9.4.4 第 3 条）。
            HttpResponse<String> up = null
            for (int attempt = 1; attempt <= 2; attempt++) {
                up = httpClient.send(upload, HttpResponse.BodyHandlers.ofString())
                if (up.statusCode() == 200) { break }
                println "cfUpload: 第 ${attempt} 次尝试 HTTP ${up.statusCode()}：${up.body()}"
                if (attempt == 1 && up.statusCode() == 500) { continue }
                throw new GradleException("上传失败：HTTP ${up.statusCode()} ${up.body()}")
            }

            def parsed = new groovy.json.JsonSlurper().parseText(up.body())
            if (parsed.id == null) { throw new GradleException("响应里没有 File ID：${up.body()}") }
            println "★ cfUpload 成功：${moduleName} -> File ID = ${parsed.id}（${mod.display}，${releaseType}）"
        }
    }
}
