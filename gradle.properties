# Important Notes:
# 1. Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.
# 2. Gradle reads gradle.properties as ISO-8859-1 (java.util.Properties). NEVER put non-ASCII (Chinese) here,
#    it will silently become mojibake. Chinese text belongs in assets/<mod_id>/lang/*.json instead.

# Project
version=1.1.8
group=com.huziyang520.forbiddenchimera
java_version=25

# Common
minecraft_version=26.3
mod_name=Forbidden Chimera
mod_author=Huziyang520
mod_id=forbidden_chimera
license=MIT
credits=
description=Forbidden Chimera: six phantom chimeras with spear and knight variants plus a boss, built from vanilla phantoms and creepers. Issues: https://github.com/Huziyang520/Forbidden-Chimera/issues
minecraft_version_range=[26.3, 26.4)
## NeoForm version, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.160.5+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.1-beta

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
