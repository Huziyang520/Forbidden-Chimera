plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    // Fabric and NeoForge both bundle Fabric Mixin, so it is safe to use it in common.
    // Kept available even though the mod ships no mixin yet: behaviour patches will land here later.
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.4'))
    // GeckoLib drives the Creeper Phantom's animated model. `common` compiles against NeoForm, so the
    // NeoForge build of GeckoLib is the closest match; both loaders expose the same com.geckolib API.
    compileOnly files('../libs/geckolib-neoforge-26.3-5.5.6.jar')
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute.
// NOTE: sourcesElements / javadocElements no longer exist (sources & javadoc jars are not produced),
// so configurations must be looked up with matching {} instead of named {} or the build fails.
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.matching { it.name == variant }.configureEach {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.matching { it.name == variant }.configureEach {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
